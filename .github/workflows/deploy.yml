name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_CONTACT_FUNCTION_URL: ${{ secrets.NEXT_PUBLIC_CONTACT_FUNCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # GitHub Pages de proyecto vive bajo /<repo>; los *.github.io van a raíz.
      - name: Configurar basePath
        run: |
          # Dominio propio: se publica en raíz (basePath vacío) y se genera CNAME.
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "${{ vars.CUSTOM_DOMAIN }}" > "$GITHUB_WORKSPACE/CNAME"
            exit 0
          fi
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$repo" >> "$GITHUB_ENV"
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      # GitHub Pages sirve CNAME desde la raíz del artefacto publicado.
      - name: Añadir CNAME si hay dominio propio
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: cp "$GITHUB_WORKSPACE/CNAME" out/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
